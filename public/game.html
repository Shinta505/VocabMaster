<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster - Game Center</title>
    <link rel="icon" type="image/png" href="https://sbnzxduuaimpyfoxoaft.supabase.co/storage/v1/object/public/assets/logo.png">
    <!-- Tailwind CSS untuk Styling Responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK untuk integrasi Backend -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page w-full h-screen overflow-hidden text-slate-800 flex flex-col relative">

    <!-- Komponen Pesan Global (Toast) -->
    <div id="toastMessage" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-full font-bold text-white shadow-lg transition-transform duration-300 transform -translate-y-24 opacity-0">
        Pesan
    </div>

    <!-- Header Navbar -->
    <header class="h-16 bg-white shadow-sm flex items-center justify-between px-4 lg:px-8 z-50 shrink-0">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='/dashboard'" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors" title="Kembali ke Dashboard">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-xl font-black text-blue-600 tracking-tight"><i class="fa-solid fa-gamepad mr-2"></i>Game Center</h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="loadingData" class="text-sm font-bold text-slate-400 hidden animate-pulse">
                <i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat Kosakata...
            </div>
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-black" id="userInitial">U</div>
        </div>
    </header>

    <!-- AREA LAYAR UTAMA (Manajemen FSM Screen) -->
    <main class="flex-1 relative overflow-hidden bg-slate-50">
        
        <!-- LAYAR 1: Menu Pilihan Game -->
        <section id="screen-menu" class="absolute inset-0 overflow-y-auto p-4 lg:p-8">
            <div class="max-w-6xl mx-auto">
                <div class="mb-8 text-center">
                    <h2 class="text-3xl font-black text-slate-800 mb-2">Pilih Mode Bermain</h2>
                    <p class="text-slate-500 font-medium">Kosakata diambil dari daftar hafalanmu secara otomatis.</p>
                </div>
                <!-- Grid Menu Game akan di-render oleh JS -->
                <div id="gameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 lg:gap-6 pb-10">
                </div>
            </div>
        </section>

        <!-- LAYAR 2: Instruksi Game -->
        <section id="screen-instruction" class="absolute inset-0 bg-white z-10 hidden flex-col items-center justify-center p-6">
            <div class="max-w-md w-full text-center">
                <div id="inst-icon" class="w-24 h-24 mx-auto rounded-3xl mb-6 flex items-center justify-center text-5xl shadow-lg"></div>
                <h2 id="inst-title" class="text-3xl font-black mb-4 text-slate-800">Nama Game</h2>
                <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 mb-8 text-left">
                    <h3 class="font-bold text-blue-800 mb-2 text-sm uppercase tracking-wider"><i class="fa-solid fa-scroll mr-2"></i>Cara Bermain</h3>
                    <p id="inst-desc" class="text-slate-600 font-medium leading-relaxed"></p>
                </div>
                <div class="flex gap-3">
                    <button onclick="showScreen('menu')" class="flex-1 py-4 rounded-2xl font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors">Batal</button>
                    <button onclick="startGameEngine()" class="flex-1 py-4 rounded-2xl font-black text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-transform active:scale-95">Mulai Bermain <i class="fa-solid fa-play ml-2"></i></button>
                </div>
            </div>
        </section>

        <!-- LAYAR 3: Gameplay -->
        <section id="screen-gameplay" class="absolute inset-0 bg-slate-900 z-20 hidden flex-col">
            <!-- HUD Gameplay -->
            <div class="h-16 px-4 bg-slate-800/80 backdrop-blur-md flex items-center justify-between shrink-0 border-b border-white/10">
                <div class="flex items-center gap-4 text-white">
                    <button onclick="pauseGame()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"><i class="fa-solid fa-pause"></i></button>
                    <div class="hidden sm:block">
                        <span id="hud-game-title" class="font-black text-lg">Game</span>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Progress</span>
                        <span id="hud-progress" class="font-black text-blue-400">1 / 10</span>
                    </div>
                    <div class="flex flex-col items-end" id="hud-lives-container">
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Nyawa</span>
                        <div id="hud-lives" class="flex gap-1 text-red-500 text-sm">
                            <i class="fa-solid fa-heart"></i><i class="fa-solid fa-heart"></i><i class="fa-solid fa-heart"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Area Kanvas Game (Dinamis disuntik oleh JS) -->
            <div id="game-canvas" class="flex-1 relative overflow-hidden flex flex-col items-center justify-center p-4">
                <!-- Konten Game -->
            </div>
        </section>

        <!-- LAYAR 4: Evaluasi / Hasil -->
        <section id="screen-result" class="absolute inset-0 bg-white z-30 hidden flex-col overflow-y-auto">
            <div class="max-w-3xl mx-auto w-full p-6 lg:p-10 pt-12">
                <div class="text-center mb-10">
                    <div id="res-icon" class="w-24 h-24 mx-auto bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-5xl mb-4 shadow-inner">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h2 class="text-4xl font-black text-slate-800 mb-2">Sesi Selesai!</h2>
                    <p class="text-lg text-slate-500 font-medium">Akurasi: <span id="res-accuracy" class="text-blue-600 font-bold">100%</span></p>
                </div>

                <div id="mistakes-container" class="mb-10 hidden">
                    <h3 class="font-bold text-red-500 mb-4 flex items-center gap-2 bg-red-50 p-3 rounded-xl border border-red-100">
                        <i class="fa-solid fa-triangle-exclamation"></i> Fokus Perbaikan (Kosakata yang salah)
                    </h3>
                    <div id="mistakes-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- Daftar kesalahan diinjeksi disini -->
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="showScreen('menu')" class="px-8 py-4 rounded-2xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-grid-2"></i> Pilih Game Lain
                    </button>
                    <button onclick="startGameEngine()" class="px-8 py-4 rounded-2xl font-black text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Main Lagi
                    </button>
                </div>
            </div>
        </section>

        <!-- Modal Pause -->
        <div id="modal-pause" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] hidden items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
                <h3 class="text-2xl font-black text-slate-800 mb-6">Game Dijeda</h3>
                <div class="space-y-3">
                    <button onclick="resumeGame()" class="w-full py-4 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 transition-colors">Lanjutkan</button>
                    <button onclick="exitGame()" class="w-full py-4 rounded-xl font-bold text-red-600 bg-red-50 hover:bg-red-100 transition-colors">Keluar Game</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Skrip Utama Logika Game -->
    <script src="/javascript/game.js"></script>
</body>
</html>
