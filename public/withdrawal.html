<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Penarikan - VocabMaster</title>
    <link rel="icon" type="image/png" href="https://sbnzxduuaimpyfoxoaft.supabase.co/storage/v1/object/public/assets/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg relative">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-money-bill-transfer text-blue-600"></i> Kelola Penarikan
        </h2>
        
        <div id="loadingState" class="text-center py-10">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500 mb-2"></i>
            <p class="text-gray-500 text-sm">Memuat data penarikan...</p>
        </div>

        <div id="errorState" class="hidden text-center py-10">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
            <p id="errorMsg" class="text-red-500 text-sm font-medium">Data tidak ditemukan.</p>
        </div>

        <form id="adminWdForm" class="hidden space-y-4">
            <input type="hidden" id="wdId">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">ID Penarikan</label>
                    <div id="displayId" class="text-sm font-medium text-gray-800 bg-gray-50 p-2 rounded border border-gray-200"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Saldo User</label>
                    <div id="displayBalance" class="text-sm font-bold text-green-600 bg-green-50 p-2 rounded border border-green-200"></div>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Nominal Ditarik</label>
                <div id="displayAmount" class="text-lg font-black text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>
            </div>

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-3">
                <h3 class="text-xs font-bold text-blue-800 uppercase tracking-wider"><i class="fa-solid fa-building-columns"></i> Info Rekening</h3>
                <div>
                    <span class="block text-xs text-blue-600">Bank / E-Wallet</span>
                    <span id="displayBank" class="font-bold text-gray-800"></span>
                </div>
                <div>
                    <span class="block text-xs text-blue-600">Nomor Rekening / HP</span>
                    <div class="flex items-center justify-between">
                        <span id="displayAccountNo" class="font-bold text-gray-800 text-lg"></span>
                        <button type="button" onclick="copyText('displayAccountNo')" class="text-blue-500 hover:text-blue-700 text-xs font-bold bg-white px-2 py-1 rounded shadow-sm border border-blue-200"><i class="fa-regular fa-copy"></i> Copy</button>
                    </div>
                </div>
                <div>
                    <span class="block text-xs text-blue-600">Nama Pemilik</span>
                    <span id="displayAccountName" class="font-bold text-gray-800"></span>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-4 mt-2">
                <label class="block text-sm font-bold text-gray-700 mb-2">Ubah Status Penarikan</label>
                <select id="wdStatus" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none font-bold" onchange="toggleProofInput()">
                    <option value="pending" class="text-yellow-600">⏳ PENDING</option>
                    <option value="success" class="text-green-600">✅ SUCCESS (Berhasil)</option>
                    <option value="failed" class="text-red-600">❌ FAILED (Gagal)</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">Jika SUCCESS, saldo user akan otomatis terpotong dan email bukti dikirim ke user tersebut.</p>
            </div>

            <div id="proofContainer" class="hidden">
                <label class="block text-sm font-bold text-gray-700 mb-2">Link Bukti Transfer (G-Drive / dsb)</label>
                <input type="url" id="wdProofLink" placeholder="Masukkan URL gambar bukti (opsional tapi disarankan)" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div id="updateStatusMsg" class="hidden p-3 rounded-lg text-sm border font-medium"></div>

            <button type="submit" id="submitBtn" class="w-full bg-gray-800 hover:bg-black text-white font-bold py-3 rounded-lg transition-colors shadow-lg mt-4 flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
            </button>
        </form>
    </div>

    <script src="/javascript/withdrawal.js"></script>
</body>
</html>
